services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snow_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snow_portal}
      POSTGRES_DB: ${POSTGRES_DB:-snow_portal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snow_portal} -d ${POSTGRES_DB:-snow_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-snow_portal}:${POSTGRES_PASSWORD:-snow_portal}@postgres:5432/${POSTGRES_DB:-snow_portal}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - snowflake_cache:/root/.cache/snowflake
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  snowflake_cache:
